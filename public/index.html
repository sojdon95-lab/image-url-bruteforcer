<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XORTRON | IMAGE HUNTER PRO</title>
    <style>
        body { background: #0a0a0c; color: #00ffcc; font-family: 'Courier New', monospace; padding: 30px; }
        .panel { background: #16161d; border: 2px solid #00ffcc; padding: 25px; border-radius: 12px; max-width: 1000px; margin: auto; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); }
        h1 { text-align: center; text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid #00ffcc; padding-bottom: 10px; }
        label { display: block; margin-top: 20px; font-size: 14px; }
        textarea, input { background: #000; border: 1px solid #00ffcc; color: #00ffcc; padding: 12px; margin: 10px 0; width: 100%; box-sizing: border-box; font-family: 'Courier New', monospace; outline: none; }
        textarea { height: 120px; }
        button { background: #00ffcc; color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        button:hover { background: #00b394; transform: scale(1.01); }
        #log { margin-top: 20px; background: #000; border: 1px solid #333; padding: 10px; height: 200px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
        .hit { color: #fff; background: #00aa00; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
        .fail { color: #666; }
        #gallery { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; }
        .img-card { border: 1px solid #00ffcc; background: #000; padding: 5px; text-align: center; }
        .img-card img { width: 100%; height: 100px; object-fit: cover; }
        .img-card small { font-size: 10px; color: #888; display: block; margin-top: 5px; overflow: hidden; white-space: nowrap; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>⚡ Image Hunter Pro</h1>
        
        <label>Paste URLs (One per line):</label>
        <textarea id="baseUrlList" placeholder="https://imgurtik-service13.top/photo/hash1/hash2.jpg"></textarea>
        
        <label>Sample ID (The exact part of the URL to replace):</label>
        <input id="sampleId" placeholder="e.g. CbybfyNrQ83KrTkzqcouWUHPvHJk5qC8frLA94vQ">
        
        <label>Guesses per URL:</label>
        <input id="count" type="number" value="10">
        
        <button onclick="startScan()">Execute Sweep</button>
        
        <div id="log">System: Ready...</div>
        <div id="gallery"></div>
    </div>

    <script>
        async function startScan() {
            const log = document.getElementById('log');
            const gallery = document.getElementById('gallery');
            log.innerHTML = 'Searching targets... please wait...';
            gallery.innerHTML = '';

            const payload = {
                baseUrlList: document.getElementById('baseUrlList').value,
                sampleId: document.getElementById('sampleId').value,
                count: document.getElementById('count').value
            };

            try {
                const res = await fetch('http://localhost:3000/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                log.innerHTML = '';
                let found = 0;
                data.results.forEach(r => {
                    const line = document.createElement('div');
                    if(r.status === 'MATCH') {
                        found++;
                        line.innerHTML = `<span class="hit">MATCH:</span> ${r.url}`;
                        const card = document.createElement('div');
                        card.className = 'img-card';
                        card.innerHTML = `<img src="${r.url}"><small>VALID</small>`;
                        gallery.appendChild(card);
                    } else {
                        line.innerHTML = `<span class="fail">FAIL:</span> ${r.url}`;
                    }
                    log.appendChild(line);
                });
                log.innerHTML = `<strong>COMPLETE. Found ${found} valid images.</strong><br>` + log.innerHTML;
            } catch (e) {
                log.innerHTML = 'Critical Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
